<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/storage.js" defer></script>
    <script src="./JS/flats.js" defer></script>
</head>
<body>
    <header class="header-site">
        <nav class="navbar">
            <div class="logo-menu">
                <a  href="./index.html"><b>RentEase</b></a>
            </div>
            <div id="botoes-pesquisa">
                <a href="./index.html">Resumo</a>
                <a href="./flats.html">Apartamentos</a>
                <a href="./new-flat.html">Cadastrar</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="refinar-apartamentos">
            <form class="form-filtros">
                <div class="filtro-cidade">
                    <label class="label-input-filtro"><b>Cidade:</b></label> <input type="text" id="filtro-cidade" placeholder="Lisboa">
                </div>
                <div class="filtro-valor">
                    <label class="label-input-filtro"><b>Valor Maximo(€):</b></label> <input type="text" id="filtro-valor-maximo" placeholder="500">
                    <label class="label-input-filtro"><b>Valor Minimo(€):</b></label> <input type="text" id="filtro-valor-minimo" placeholder="500">
                </div>
                <div class="filtro-area">
                    <label class="label-input-filtro"><b>Area Maxima(m²):</b></label> <input type="text" id="filtro-area-maximo" placeholder="110">
                    <label class="label-input-filtro"><b>Area Minima(m²):</b></label> <input type="text" id="filtro-area-minimo" placeholder="110">
                </div>
                <div class="filtro-buttons">
                    <button type="button" id="button-aplicar">Aplicar filtros</button>
                    <button type="button" id="button-limpar-filtro">Limpar filtros</button>
                </div>
            </form>
            <div class="botoes-ordenar">
                <button id="button-cidade">Cidades alfabeticas</button>
                <button id="button-preco-ascendente">Preco ascendente</button>
                <button id="button-preco-descendente">Preco descendente</button>
                <button id="button-area-ascendente">Area ascendente</button>
                <button id="button-area-descendente">Area descendente</button>
                <button id="button-limpar">Limpar</button>
            </div>
        </section>
        <section class="apartamentos-cadastrados">
            <p id="paragrafoNenhum"><b>Nenhum apartamento cadastrado!</b></p>
        </section>
        <section class="cadastrar-novo">
            <h2>Cadastre um novo apartamento</h2>
            <a href="./new-flat.html">Cadastrar</a>
        </section>
        <section id="modal" class="hidden">
            <div class="container-modal">
                <div class="div-modal-texto">
                    <p class="texto-modal">
                        Deseja mesmo deletar o apartamento selecionado?
                        <br>
                        Apos deletar, nao tem como voltar atras!
                    </p>
                </div>
                <div class="div-modal-button">
                    <button type="button" class="modal-button-cancelar">Cancelar</button>
                    <button type="button" class="modal-button-deletar">Deletar</button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer-pagina">
        <div class="contacto-footer">
            <a href="">rentease@suport.com</a>
        </div>
        <div class="redes-sociais">
            <a href=""><img class="instagram-logo" src="./imgs/icone-Instagram.png" alt="Instagram"></a>
            <a href=""><img class="facebook-logo" src="./imgs/icone-Facebook.png" alt="Facebook"></a>
        </div>
    </footer>
</body>
</html>
